# Minimal stand-in for the Flux HelmRelease CRD.
#
# The sandbox `ci-verify-basic` namespace contained a Flux `HelmRelease`
# (apps/ci-verify-basic/helm.yaml), and rw-cli-codecollection ships a
# detailed-only generation rule (k8s-fluxcd-helm-health) that matches
# `helmreleases.helm.toolkit.fluxcd.io`. Without the CRD the instance can't be
# indexed, so the detailed-LOD test loses one SLX.
#
# Rather than depend on the full Flux install (and its network fetch) in CI, we
# define the smallest CRD that lets the API server serve and the indexer list a
# HelmRelease. No Flux controller runs, which is fine: discovery inspects the
# API objects only.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  group: helm.toolkit.fluxcd.io
  names:
    kind: HelmRelease
    listKind: HelmReleaseList
    plural: helmreleases
    singular: helmrelease
  scope: Namespaced
  versions:
    - name: v2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
