# Build the RunWhen Local image
name: Build and Push on PR Open
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/pr_open.yaml"

permissions:
  contents: "read"
  id-token: "write"
  security-events: "write"
  actions: "read"

env:
  PROJECT_ID: runwhen-nonprod-shared
  IMAGE: runwhen-local
  DEFAULT_BRANCH: "origin/${{ github.event.repository.default_branch }}"
  CONTAINER_NAME: "runwhen-local"
  SHARED_ARTIFACT_REPOSITORY_PATH: "us-docker.pkg.dev/runwhen-nonprod-shared/public-images"
  SANDBOX_DEPLOYMENT_NAME: "runwhen-local"
  SANDBOX_DEPLOYMENT_NAMESPACE: "runwhen-local"
  APP_LABEL: "app=runwhen-local"

jobs:
  scan-repo:
    runs-on: ubuntu-latest
    outputs:
      image_path: ${{ steps.publish-beta.outputs.image_path }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      # - name: Run Trivy vulnerability scanner in repo mode
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     scan-type: 'fs'
      #     ignore-unfixed: true
      #     format: 'sarif'
      #     output: 'trivy-results-repo.sarif'
      #     severity: 'CRITICAL'

      # - name: Upload Trivy scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: 'trivy-results-repo.sarif'

  # Cheap gate that runs BEFORE the multi-arch image build/push. Renovate
  # dependency updates can land with a poetry.lock whose content-hash does not
  # match pyproject.toml, which makes `poetry install` (Dockerfile builder stage)
  # fail with "pyproject.toml changed significantly since poetry.lock was last
  # generated". Validate using the SAME Poetry version pinned in the Dockerfile
  # so we catch broken lockfiles here instead of after pushing images.
  validate-poetry-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry pinned in Dockerfile
        run: |
          set -euo pipefail
          POETRY_VERSION="$(sed -n 's/^[[:space:]]*POETRY_VERSION=\([0-9][0-9.]*\).*$/\1/p' src/Dockerfile | head -n1)"
          if [ -z "$POETRY_VERSION" ]; then
            echo "::error::Could not determine POETRY_VERSION from src/Dockerfile"
            exit 1
          fi
          curl -fsSL https://install.python-poetry.org | python3 - --version "$POETRY_VERSION"
          poetry --version
      - name: Validate poetry.lock is in sync with pyproject.toml
        run: |
          cd src
          if ! poetry check --lock; then
            echo "::error::poetry.lock is out of sync with pyproject.toml. Regenerate it with the Poetry version pinned in src/Dockerfile (poetry lock) and commit the updated lockfile."
            exit 1
          fi

  # Build amd64 natively on x86_64
  build-amd64:
    runs-on: ubuntu-latest
    needs: [validate-poetry-lock]
    env:
      IMAGE: runwhen-local
      SHARED_ARTIFACT_REPOSITORY_PATH: us-docker.pkg.dev/runwhen-nonprod-shared/public-images
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          echo "TAG=$(echo $GITHUB_REF_NAME | sed 's/[^a-zA-Z0-9]/-/g')-${GITHUB_SHA::8}" | tee -a $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_PROVIDER }}
          service_account: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_SA }}
      - run: gcloud --quiet auth configure-docker us-docker.pkg.dev
      - name: Build & push linux/amd64
        run: |
          cd src
          docker buildx create --use --name mybuilder || docker buildx use mybuilder
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${{ env.SHARED_ARTIFACT_REPOSITORY_PATH }}/${{ env.IMAGE }}:${TAG}-amd64" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            -f Dockerfile .

  # Build arm64 natively on GitHub-hosted ARM
  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [validate-poetry-lock]
    env:
      IMAGE: runwhen-local
      SHARED_ARTIFACT_REPOSITORY_PATH: us-docker.pkg.dev/runwhen-nonprod-shared/public-images
    steps:
      - uses: actions/checkout@v4
      - run: echo "TAG=$(echo $GITHUB_REF_NAME | sed 's/[^a-zA-Z0-9]/-/g')-${GITHUB_SHA::8}" | tee -a $GITHUB_ENV
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_PROVIDER }}
          service_account: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_SA }}
      - run: gcloud --quiet auth configure-docker us-docker.pkg.dev
      - name: Build & push linux/arm64
        run: |
          cd src
          docker buildx create --use --name mybuilder || docker buildx use mybuilder
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --tag "${{ env.SHARED_ARTIFACT_REPOSITORY_PATH }}/${{ env.IMAGE }}:${TAG}-arm64" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            -f Dockerfile .

  # Stitch the multi-arch tag when both are pushed
  publish-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    env:
      IMAGE: runwhen-local
      SHARED_ARTIFACT_REPOSITORY_PATH: us-docker.pkg.dev/runwhen-nonprod-shared/public-images
    steps:
      - run: echo "TAG=$(echo $GITHUB_REF_NAME | sed 's/[^a-zA-Z0-9]/-/g')-${GITHUB_SHA::8}" | tee -a $GITHUB_ENV
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_PROVIDER }}
          service_account: ${{ secrets.RUNWHEN_NONPROD_SHARED_WI_SA }}
      - run: gcloud --quiet auth configure-docker us-docker.pkg.dev
      - name: Create & push manifest
        run: |
          FULL="${{ env.SHARED_ARTIFACT_REPOSITORY_PATH }}/${{ env.IMAGE }}"
          docker buildx imagetools create \
            --tag "${FULL}:${TAG}" \
            "${FULL}:${TAG}-amd64" \
            "${FULL}:${TAG}-arm64"
      - name: Inspect manifest
        run: |
          FULL="${{ env.SHARED_ARTIFACT_REPOSITORY_PATH }}/${{ env.IMAGE }}"
          docker buildx imagetools inspect "${FULL}:${TAG}"

      - name: Notify Slack of Container Build
        id: slack-publish-nonprod-shared-artifact-repo
        uses: slackapi/slack-github-action@v1.19.0
        with:
          channel-id: "#notifications" # Slack channel id or name to post message. https://api.slack.com/methods/chat.postMessage#channels
          slack-message: "Just Pushed to ${{env.SHARED_ARTIFACT_REPOSITORY_PATH }}/${{ env.IMAGE }}:${{ env.TAG }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify:
    runs-on: ubuntu-latest
    needs:
      - publish-manifest
      - scan-repo
    if: always()  # Ensure this runs even if previous jobs fail

    steps:
      - name: Set Workflow Status
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "status=❌ *Failure*" >> $GITHUB_ENV
          else
            echo "status=✅ *Success*" >> $GITHUB_ENV
          fi

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: "#runwhen-local"
          slack-message: "${{ env.status }} - Workflow *${{ github.workflow }}* in repo *${{ github.repository }}* on branch *${{ github.ref_name }}*.\nSee the run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}